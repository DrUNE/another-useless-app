name: Audit

# Новая уязвимость появляется в базе RUSTSEC без единого изменения в нашем коде, поэтому проверка зависимостей идёт и по расписанию
# (ADR-0018). Падение этого workflow означает «вышла новая запись об уязвимости или о неподдерживаемом пакете».
on:
  schedule:
    # Раз в неделю, в понедельник; нестандартная минута, чтобы не попадать на пик нагрузки GitHub.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: audit (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories
