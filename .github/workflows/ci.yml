name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый запуск на тот же PR отменяет устаревший.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Минимум прав: проверкам достаточно читать код.
permissions:
  contents: read

jobs:
  # Rust и TS проверяются независимо (ADR-0006): job rust не ставит bun, job ts не ставит Rust.
  rust:
    name: rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # app-native тянет WebKitGTK и собирается в отдельном job (ADR-0010).
      - run: cargo test --workspace --exclude app-native --locked

  ts:
    name: ts (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test

  # Web зависит от WASM-сборки ядра (ADR-0008), поэтому ей нужны оба тулчейна.
  wasm:
    name: wasm (build and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Версия CLI обязана совпадать с крейтом wasm-bindgen: берём её из Cargo.lock, а не дублируем.
      - id: wbg
        run: echo "version=$(cargo pkgid wasm-bindgen | sed 's/.*@//')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      # Инвариант ADR-0002: ядро собирается под wasm32.
      - run: cargo check -p app-core --target wasm32-unknown-unknown --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Собирает WASM и проверяет TS-типы кода, который его использует (core-wasm и web).
      - run: bun run check:wasm
      # Тесты границы Rust↔JS: на bun, Node.js не нужен (ADR-0013).
      - run: bun run test:wasm
      # Web использует WASM-ядро, поэтому собирается здесь, а не в job `ts` (ADR-0014).
      - run: bun run build:web
      # Сквозной сценарий в настоящем браузере (Chrome есть на раннере). Без браузера тест падает, а не пропускается.
      - run: bun run --filter @app/e2e test:e2e
        env:
          E2E_REQUIRE_BROWSER: "1"

  # Десктоп: Tauri требует системных библиотек, поэтому живёт в своём job (ADR-0010).
  native:
    name: native (desktop build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Список пакетов один на CI, devcontainer и подсказки `bun run doctor`.
      - run: |
          sudo apt-get update
          xargs -a tools/system-deps/debian.txt sudo apt-get install -y --no-install-recommends
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Тесты IPC и проверка актуальности TS-привязок (ADR-0009).
      - run: cargo test -p app-native --locked
      # Полная сборка без упаковки: проверяет связку Vite, Tauri CLI и Rust.
      - run: bun run build:native -- --no-bundle
