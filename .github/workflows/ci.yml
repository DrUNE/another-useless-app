name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый запуск на тот же PR отменяет устаревший.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Минимум прав: проверкам достаточно читать код.
permissions:
  contents: read

jobs:
  # Rust и TS проверяются независимо (ADR-0006): job rust не ставит bun, job ts не ставит Rust.
  rust:
    name: rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  ts:
    name: ts (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
