name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый запуск на тот же PR отменяет устаревший.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Минимум прав: проверкам достаточно читать код.
permissions:
  contents: read

jobs:
  # Rust и TS проверяются независимо (ADR-0006): job rust не ставит bun, job ts не ставит Rust.
  rust:
    name: rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked

  ts:
    name: ts (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  # Web зависит от WASM-сборки ядра (ADR-0008), поэтому ей нужны оба тулчейна.
  wasm:
    name: wasm (build and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Версия CLI обязана совпадать с крейтом wasm-bindgen: берём её из Cargo.lock, а не дублируем.
      - id: wbg
        run: echo "version=$(cargo pkgid wasm-bindgen | sed 's/.*@//')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      # Инвариант ADR-0002: ядро собирается под wasm32.
      - run: cargo check -p app-core --target wasm32-unknown-unknown --locked
      - run: cargo test -p app-core-wasm --target wasm32-unknown-unknown --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Собирает WASM и проверяет TS-типы, сгенерированные wasm-bindgen.
      - run: bun run check:wasm
