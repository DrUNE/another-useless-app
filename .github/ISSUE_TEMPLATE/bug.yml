name: Bug
description: Что-то работает не так, как задумано
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Что происходит
      description: Ожидаемое и фактическое поведение.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Как воспроизвести
      description: Команды, цель сборки (cli, web, desktop, mobile), платформа и версии.
    validations:
      required: true
